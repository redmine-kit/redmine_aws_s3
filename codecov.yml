# Codecov (https://docs.codecov.com/docs/codecov-yaml). CI uploads the
# coverage of the plugin's own files (coverage/coverage.xml, flag plugin) with
# OIDC. The statuses inform and never fail a commit or a pull request.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment: false
ignore:
  - "test/**"
