name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/lint
      - run: for test in test/javascripts/*_test.mjs; do node "$test"; done

  # Redmine's release, and master before the next release (7.1, which adds
  # the avatars the plugin sends through S3). master is not pinned and does
  # not fail the run.
  test:
    needs: static
    name: test (Redmine ${{ matrix.redmine }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        redmine: ["7.0.3", master]
    continue-on-error: ${{ matrix.redmine == 'master' }}
    permissions:
      contents: read
      id-token: write # Codecov with OIDC, no token stored
    env:
      REDMINE_BRANCH: ${{ matrix.redmine == 'master' && 'master' || '' }}
      # The checkout of redmine_aws below.
      REDMINE_AWS_DIR: redmine_aws
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # redmine_aws, which the plugin requires, until the tests install its
      # gem. The plugin's .dockerignore keeps it out of the plugin's image.
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_aws
          path: redmine_aws
          persist-credentials: false
      # LocalStack when the organization's token is available, moto otherwise
      # (pull requests from forks); bin/test prints which one ran.
      - run: bin/test
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      # Redmine's own attachment tests with the plugin on, and the browser,
      # also after a failure above, so that every kind of test reports.
      - if: ${{ !cancelled() }}
        run: bin/test core-s3
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - if: ${{ !cancelled() }}
        run: bin/test system
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      # Not failing the run while the Codecov GitHub App is not installed.
      - if: matrix.redmine != 'master'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/coverage.xml
          use_oidc: true
          fail_ci_if_error: false
      - if: always()
        run: bin/services --system --down
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
