name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The Rubies of Redmine 7.0 (3.2 to 4.0), pinned in
        # test/ruby-<version>.Dockerfile.
        ruby: ["3.2", "4.0"]
    env:
      TEST_RUBY: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/lint
      # The scripts don't depend on Ruby; once is enough.
      - if: matrix.ruby == '4.0'
        run: for test in test/javascripts/*_test.mjs; do node "$test"; done

  # Redmine's release on the Rubies of Redmine 7.0 (3.2 to 4.0), and master
  # before the next release (7.1, which adds the avatars the plugin sends
  # through S3) on Ruby 4.0. master is not pinned and does not fail the run.
  test:
    needs: static
    name: test (Redmine ${{ matrix.redmine }}, Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - redmine: "7.0.3"
            ruby: "3.2"
          - redmine: "7.0.3"
            ruby: "4.0"
          - redmine: master
            ruby: "4.0"
    continue-on-error: ${{ matrix.redmine == 'master' }}
    permissions:
      contents: read
      id-token: write # Codecov with OIDC, no token stored
    env:
      REDMINE_BRANCH: ${{ matrix.redmine == 'master' && 'master' || '' }}
      TEST_RUBY: ${{ matrix.ruby }}
      # The checkout of redmine_aws below.
      REDMINE_AWS_DIR: redmine_aws
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # redmine_aws, which the plugin requires, until the tests install its
      # gem. The plugin's .dockerignore keeps it out of the plugin's image.
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_aws
          path: redmine_aws
          persist-credentials: false
      # LocalStack when the organization's token is available, moto otherwise
      # (pull requests from forks); bin/test prints which one ran.
      - run: bin/test
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      # Redmine's own attachment tests with the plugin on, and the browser,
      # also after a failure above, so that every kind of test reports.
      - if: ${{ !cancelled() }}
        run: bin/test core-s3
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - if: ${{ !cancelled() }}
        run: bin/test system
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      # Not failing the run while the Codecov GitHub App is not installed.
      - if: matrix.redmine != 'master' && matrix.ruby == '4.0'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/coverage.xml
          use_oidc: true
          fail_ci_if_error: false
      - if: always()
        run: bin/services --system --down
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

  # The tests against the latest release of redmine_aws (its newest v0.1.*
  # tag, the source of the published gem), as well as against its main
  # above: adapters install the release. Skipped until there is one.
  release:
    needs: static
    name: test (redmine_aws release)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: release
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/redmine-kit/redmine_aws.git 'v0.1.*' |
            sed 's|.*refs/tags/||' | sort -V | tail -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [[ -n "$tag" ]] || echo "::notice::redmine_aws has no v0.1.* release yet; not tested against one"
      - if: steps.release.outputs.tag != ''
        uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_aws
          ref: ${{ steps.release.outputs.tag }}
          path: redmine_aws
          persist-credentials: false
      - if: steps.release.outputs.tag != ''
        run: bin/test
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          REDMINE_AWS_DIR: redmine_aws
      - if: always() && steps.release.outputs.tag != ''
        run: bin/services --down
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
