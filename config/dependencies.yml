# The plugins of Redmine Kit this plugin uses (README.md, "Requirements"). `requires`: it does not work
# without them; the gem depends on them (the ranges), and init.rb stops Redmine at boot when one is
# missing (config/dependencies.rb). `suggests`: it works without them and does more with them; they are
# no gem dependencies. redmine_kit_ui lists both in the new UI's Administration › Plugins.
plugin: redmine_kit_aws_s3
requires:
  redmine_kit_aws: "~> 0.1"
suggests:
  - redmine_kit_help
